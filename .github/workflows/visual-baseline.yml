# Seeds or refreshes the visual-regression baselines (e2e/visual.spec.ts-snapshots/*-linux.png).
#
# Baselines must come from the same ubuntu-latest image that compares them in ci.yml (fonts and
# anti-aliasing differ per platform), so they are made here, never on a developer machine. Run it by hand
# (Actions → "Visual baselines" → Run workflow, or `gh workflow run visual-baseline.yml`) when there is no
# baseline yet, or after a deliberate visual change.
#
# A baseline is only committed when it is stable: after capturing, the suite is compared against the new
# images twice more without retries. A page that renders differently from one run to the next (a clock, an
# unfinished animation, unordered data) fails that check here, instead of becoming a baseline that fails CI
# at random afterwards.
name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start production server
        run: npx next start &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 --max-time 2 || true)
            if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "server did not become ready in time" && exit 1

      - name: Capture baselines
        env:
          SMOKE_BASE: http://localhost:3000
        run: npx playwright test e2e/visual.spec.ts --update-snapshots=all

      - name: Confirm the baselines are stable
        env:
          SMOKE_BASE: http://localhost:3000
        run: npx playwright test e2e/visual.spec.ts --repeat-each=2 --retries=0

      - name: Upload the report if unstable
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-report
          path: |
            playwright-report/
            test-results/

      - name: Commit the baselines
        run: |
          git add e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Visual baselines from ubuntu-latest (run ${GITHUB_RUN_ID})"
          git push
