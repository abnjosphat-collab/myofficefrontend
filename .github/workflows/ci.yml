# Runs the frontend checks on every push/PR to main: type-check, unit tests, and the
# Playwright smoke suite (e2e/smoke.mjs — loads every real page with /api/** mocked,
# fails on console errors/hydration issues). Nothing here deploys anything (Vercel
# deploys on push to main independently) — this only answers "did this change break
# something," automatically.
#
# The smoke suite runs against `next build && next start` (a production build), not
# `next dev` — dev mode's first-hit-per-route Turbopack compile is measurably slower,
# and it's the more realistic thing to gate on anyway. It does NOT fully eliminate an
# occasional single-route timeout, though (confirmed locally: still saw one on a
# production server, on a route that loaded in under 200ms a moment later via plain
# curl — a transient Playwright/first-request hiccup, not a real defect and not
# specific to dev-mode compilation). The retry below is the actual fix for that: one
# retry clears it every time it's been seen.
#
# NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are intentionally not
# configured here: lib/supabase.ts degrades to a loud console warning (not a crash)
# when they're unset, "build always succeeds" per its own comment — and the smoke
# suite exercises the anonymous/logged-out view anyway. Add them as repo secrets later
# if a fuller signed-in check is ever wanted; not required for this to be useful today.
#
# The visual-regression suite (e2e/visual.spec.ts, added 2026-08-29 — see
# audit/07-ui-polish-findings.md) runs as its own step after the smoke suite, same
# server. Its baselines are Linux-specific (Playwright suffixes snapshot filenames by
# platform automatically), which is exactly why this has to be the environment that
# generates them — see playwright.config.ts's top comment. The very first run after
# this workflow lands has NO committed baseline yet and will fail; that run's failure
# artifact (or a manual `npx playwright test --update-snapshots` run against this same
# ubuntu-latest image) is what gets committed to seed it, not a local dev machine.

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        # continue-on-error: TEMPORARY, until the remaining 34 react-hooks/set-state-in-effect
        # errors are worked through deliberately (each needs a per-site read, not a blind
        # fix — see the 2026-08-30 remediation plan). Everything else eslint flags as an
        # error is already clean as of that pass. Remove this line once that's done, so a
        # real regression actually fails the build instead of just annotating it.
        continue-on-error: true
        run: npx eslint . --ext .ts,.tsx

      - name: Unit tests
        run: npx vitest run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start production server
        run: npx next start &
        # Backgrounds the server for the rest of the job; GitHub Actions tears down
        # the whole job (and every process in it) when the job finishes, so nothing
        # explicit needs to kill it.

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 --max-time 2 || true)
            if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "server did not become ready in time" && exit 1

      - name: Smoke suite
        run: npm run test:smoke || (echo "Retrying once — see comment above on transient first-request flakiness" && npm run test:smoke)

      - name: Visual regression suite
        id: visual
        # continue-on-error: TEMPORARY, until a first baseline is committed (see the
        # top-of-file comment — there is no e2e/visual.spec.ts-snapshots/*-linux.png
        # in the repo yet). Remove this line once that baseline exists, so a real
        # visual regression actually fails the build instead of just annotating it.
        continue-on-error: true
        env:
          SMOKE_BASE: http://localhost:3000
        run: npx playwright test

      - name: Upload visual diff/report on failure
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
