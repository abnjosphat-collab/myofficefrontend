# Sidebar baseline artifact (no commit, no push).
#
# Produces the deterministic Linux sidebar-rail reference image for human
# review, using the same ubuntu-latest image that CI compares against.
# It never commits, pushes, tags or releases: it only uploads the captured
# still and the comparison evidence as a run artifact only.
#
# Use: Actions -> "Sidebar baseline artifact" -> Run workflow, then download
# the `sidebar-rail-artifact` artifact, inspect sidebar-rail.png, and only
# then decide (in a separate, explicitly authorised step) whether to adopt
# it as a baseline. A Windows/Mac still must never stand in for Linux output
# baseline: fonts and anti-aliasing differ per platform.
name: Sidebar baseline artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start production server
        run: npx next start &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 --max-time 2 || true)
            if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "server did not become ready in time" && exit 1

      - name: Capture sidebar rail
        env:
          SMOKE_BASE: http://localhost:3000
        run: npx playwright test e2e/visual.spec.ts -g sidebar-rail

      - name: Upload sidebar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-rail-artifact
          path: |
            test-results/
            playwright-report/
          retention-days: 30
